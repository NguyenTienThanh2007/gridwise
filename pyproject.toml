[project]
name = "gridwise"
version = "0.1.0"
description = "GRIDWISE workspace root (not a distributable package)."
requires-python = ">=3.13,<3.14"
dependencies = ["gridwise-api", "gridwise-grid-engine", "gridwise-worker"]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pip-audit>=2.9",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.2",
    "ruff>=0.17,<0.18",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.sources]
gridwise-api = { workspace = true }
gridwise-grid-engine = { workspace = true }
gridwise-worker = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/grid-engine"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "DTZ", "T20", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# Migrations build SQL from module constants only; no input reaches it.
# RUF100: merged migrations are never edited, so their old noqa comments stay.
"**/migrations/**" = ["N999", "S608", "RUF100"]
# A command-line smoke test: printing is its output.
"**/selfcheck.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["gridwise_api", "gridwise_grid_engine", "gridwise_worker"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api/src",
    "apps/api/tests",
    "apps/api/migrations",
    "apps/worker/src",
    "packages/grid-engine/src",
    "packages/grid-engine/tests",
]
mypy_path = ["apps/api/src", "apps/api", "apps/worker/src", "packages/grid-engine/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# pandapower ships no type information. It is imported in exactly one module (the adapter),
# which converts every value to a typed Python object before returning it.
module = ["pandapower", "pandapower.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/grid-engine/tests"]
# Explicit, so tests do not depend on the editable-install .pth file: macOS can flag that
# file hidden, and Python 3.13 ignores hidden .pth files.
pythonpath = ["apps/api/src", "apps/api", "apps/worker/src", "packages/grid-engine/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a running PostgreSQL (GRIDWISE_DATABASE_URL)",
    "worker: starts real worker processes (Linux and macOS process semantics)",
]
