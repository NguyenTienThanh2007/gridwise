name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.21"

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same database definition as local development: role-creation script, TCP
      # health check and telemetry switch all come from docker-compose.yml.
      - run: cp .env.example .env
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Unit tests
        run: uv run pytest apps/api/tests -m "not integration"
      - name: Integration tests (real PostgreSQL)
        # Worker process tests run in the Worker job.
        run: uv run pytest apps/api/tests -m "integration and not worker"
      - name: Database logs
        if: failure()
        run: docker compose logs --no-color postgres

  engine:
    name: Grid engine (tests, Linux image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Python must be 3.13
        run: uv run python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
      - name: Engine tests
        run: uv run pytest packages/grid-engine/tests
      - name: Self-check against the closed-form solution
        run: PYTHONPATH=packages/grid-engine/src uv run python -m gridwise_grid_engine.selfcheck
      - name: Build the API image with the solver stack
        run: docker build -f infrastructure/docker/api.Dockerfile -t gridwise-api:ci .
      - name: Self-check inside the image
        run: docker run --rm gridwise-api:ci python -m gridwise_grid_engine.selfcheck
      - name: The API must start without loading the solver
        run: >-
          docker run --rm
          -e GRIDWISE_DATABASE_URL=postgresql+psycopg://ci:ci@localhost/ci
          gridwise-api:ci python -c
          "import sys, gridwise_api.main as m; m.create_app();
          loaded = [n for n in ('pandapower', 'pandas', 'numpy', 'scipy') if n in sys.modules];
          print('solver libraries loaded by the API:', loaded); assert not loaded"

  web:
    name: Web (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: End to end (Compose stack + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Start postgres, migrations and API
        run: docker compose up -d --build --wait
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm --filter @gridwise/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  worker:
    name: Worker (Linux, Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Start postgres, migrations, API and worker (the worker profile)
        run: docker compose --profile worker up -d --build --wait
      - name: Worker processes against the database (kill, timeout, signals)
        run: uv run pytest -m worker apps/api/tests
      - name: The deployed worker solves a submitted job
        run: |
          job=$(uv run python scripts/worker_smoke.py submit | tail -1)
          uv run python scripts/worker_smoke.py wait "$job" 180
      - name: The solved job reproduces from its stored input
        run: uv run python -m gridwise_worker.reproduce --pending
      - name: The worker stops cleanly on SIGTERM
        run: |
          docker compose --profile worker stop -t 30 worker
          status=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose --profile worker ps -aq worker)")
          echo "worker exit code: $status"
          test "$status" = "0"
      - name: Stack logs
        if: failure()
        run: docker compose --profile worker logs --no-color

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --frozen
      - name: Python dependencies
        run: |
          uv export --frozen --no-emit-workspace --format requirements-txt -q -o requirements.txt
          uv run pip-audit --strict --disable-pip --require-hashes -r requirements.txt
      - name: Node dependencies
        run: pnpm audit --audit-level moderate
