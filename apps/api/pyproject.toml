[project]
name = "gridwise-api"
version = "0.1.0"
description = "GRIDWISE backend API."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.162,<0.163",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54,<0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridwise_api"]
